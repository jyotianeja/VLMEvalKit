version: '3.8'

x-vllm-common: &vllm-common
  image: vllm/vllm-openai:latest
  volumes:
    - /home/jyotianeja/.cache/huggingface
  environment:
    - HF_TOKEN=${HF_TOKEN}
    - HF_HOME=/app/hf_cache
    - VLLM_WORKER_MULTIPROC_METHOD=spawn
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s 
    timeout: 10s 
    retries: 3
    start_period: 120s
  command: >
    --model Qwen/Qwen3-VL-8B-Instruct
    --host 0.0.0.0
    --port 8000
    --max-num-seqs 8
    --max-model-len 65536
    --gpu-memory-utilization 0.9 

services:
  vllm-0:
    <<: *vllm-common
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

